name = "LogicKernel"
uuid = "3a0d8e50-b9f2-4a53-9210-6c7d690b17b0"
version = "0.1.0"
authors = ["CognitiveSubstratesAI"]

# NO [deps]. Deliberately: this package depends on NOTHING in the CognitiveSubstratesAI tree; other
# packages may depend on IT. `test/test_package.jl` checks both halves — the [deps] table names
# none of them, and none is loaded after `using LogicKernel` — so "standalone" is a tested
# property, not a claim about this file.
#
# 0.x until the term interface has a SECOND implementation in real use. The version is saying that,
# honestly.

[compat]
Random = "1"
Test = "1"
julia = "1.12"

# Test-only deps must be declared here: `Pkg.test` (and CI's julia-runtest) builds an ISOLATED env
# from [extras] + [targets] alone, stdlibs included — PathMap CI run #87 failed on an undeclared
# `Random` that resolved fine locally, and so did this package's `8f0bead`. Now GATED:
# test/test_package.jl fails on any package a test file loads that is not declared here.
[extras]
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Random", "Test"]
