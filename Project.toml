name = "LogicKernel"
uuid = "3a0d8e50-b9f2-4a53-9210-6c7d690b17b0"
version = "0.1.0"
authors = ["CognitiveSubstratesAI"]

# STANDALONE: this package depends on NOTHING in the CognitiveSubstratesAI tree; other packages may
# depend on IT. `test/test_package.jl` checks both halves — the [deps] table names only its
# ALLOWLIST, and no sibling is loaded after `using LogicKernel` — so "standalone" is a tested
# property, not a claim about this file. The allowlist is four packages, each named by the user or
# the audit: PrecompileTools (user, 2026-10-03), for the precompile workload
# (src/precompile_workload.jl) — a fresh process otherwise spent ~10 s compiling the hot paths
# before its first answer —, PCRE2_jll (D-1002), the stdlib JLL that carries libpcre2-8 for
# library(pcre) (ccall'd from src/pl-pcre.jl), Zlib_jll (D-1002), the stdlib JLL that carries libz
# for library(zlib) (ccall'd from src/pl-zlib.jl), and LibYAML_jll (D-1004, the audit's approval;
# same carrier rule as D-1002), the REGISTRY JLL (not a stdlib: the first resolve needs the network
# once) that carries libyaml for library(yaml) (ccall'd from src/pl-yaml.jl), pinned to the libyaml
# the oracle links (0.2.5). No wildcard: a further JLL needs its own D-entry.
#
# 0.x until the term interface has a SECOND implementation in real use. The version is saying that,
# honestly.

[deps]
LibYAML_jll = "f531010a-71ee-5b11-8e71-2f13f29d8a82"
PCRE2_jll = "efcefdf7-47ab-520b-bdef-62a2eaa19f15"
PrecompileTools = "aea7be01-6a6a-4083-8856-8a6e6704d82a"
Zlib_jll = "83775a58-1f1d-513f-b197-d71354ab007a"

[compat]
LibYAML_jll = "=0.2.5"
PCRE2_jll = "10"
PrecompileTools = "1"
Random = "1"
SHA = "0.7, 1"
Test = "1"
Zlib_jll = "1"
julia = "1.13"

# Test-only deps must be declared here: `Pkg.test` (and CI's julia-runtest) builds an ISOLATED env
# from [extras] + [targets] alone, stdlibs included — PathMap CI run #87 failed on an undeclared
# `Random` that resolved fine locally, and so did this package's `8f0bead`. Now GATED:
# test/test_package.jl fails on any package a test file loads that is not declared here.
[extras]
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
SHA = "ea8e919c-243c-51af-8825-aaa63cd721ce"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Random", "SHA", "Test"]
