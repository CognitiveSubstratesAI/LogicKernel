# The mutation battery of one step, in CI (user, 2026-10-13): since GATESPEED (audit D-0530) up to SIX SHARD JOBS on
# the free standard runners, each running its slice of the list on a WARM DAEMON (tools/mutate_ci.py warm). Started by hand, at a
# step's close, one of two ways:
#   * a PUSH of the commit to the branch `mutants/<step>` — the list is then tools/mutants/<step>.py
#     and the targets its own `TARGETS` (`git push origin <sha>:refs/heads/mutants/V9f`); no token
#     permission beyond pushing is needed;
#   * Actions → Mutation battery → Run workflow (or the API's workflow_dispatch), with
#       mutants = tools/mutants/V9f.py
#       targets = test/core_lang/test_catch_swipl.jl test/compile/test_body_code_swipl.jl
# THE VERDICT RULES ARE THE LOCAL DRIVER'S (tools/mutate_drive.py), applied by tools/mutate_ci.py:
# a target exits 1 = caught — only when a test failed: code that did not parse or load, or a test
# file with no failing test line, is NO VERDICT (D-0050); every target exits 0 = SURVIVED; past the
# limit = TIMEOUT; anything else = INVALID; a mutant declared `equivalent` must survive. SURVIVED,
# TIMEOUT, INVALID, NO VERDICT, BADMATCH and a caught "equivalent" BLOCK: the `verdicts` job is red.
# The table, with each caught mutant's first failing test line, is in that job's summary.
# NO BENCHMARKS HERE: shared runners vary; timings stay on the quiet local machine.
name: Mutation battery
on:
  push:
    branches:
      - 'mutants/**'
      - 'perf/bat-**'          # GATESPEED scratch battery: the list for perf/bat-<X> is tools/mutants/<X>.py
  workflow_dispatch:
    inputs:
      mutants:
        description: "The step's mutant list, in the repository (tools/mutants/<step>.py)"
        required: true
        type: string
      targets:
        description: "Test files, space-separated, smallest first (a mutant's own `targets` win)"
        required: true
        type: string
      ids:
        description: "Only these mutants (names, space-separated); empty = all"
        required: false
        default: ""
        type: string
      limit_s:
        description: "Seconds per target before TIMEOUT (a cold process: compilation included)"
        required: false
        default: "1500"
        type: string

concurrency:
  group: mutation-${{ github.ref }}-${{ inputs.mutants || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write          # julia-actions/cache deletes old caches (its README)

# The inputs reach the scripts as ENVIRONMENT VARIABLES, never spliced into a command line.
env:
  JULIA_NUM_THREADS: '4'
  LOGICKERNEL_REQUIRE_SWIPL: '1'      # a missing oracle is an error, never a skipped differential
  # …and a missing analysis tool too: test/test_static_analysis.jl SKIPS GREEN without JET, Aqua and
  # AllocCheck, so every mutant of a battery targeting it "survived" a target that ran nothing (Tooling2,
  # 2026-10-20: four survivors in 1 s against a 1 s baseline; caught locally). The tools are installed
  # below when the battery's targets name that file, or tools/mutate_sa_part.sh (one part of it; JETGW,
  # 2026-11-10: its baseline was NO VERDICT, `using JET` failed); a mutant's own `targets` naming it
  # without them fails closed (NO VERDICT).
  LOGICKERNEL_REQUIRE_TOOLS: '1'
  # A WHOLE-SUITE target (tools/mutate_suite.sh) runs test/test_vendored_plunit.jl and
  # test/test_vendored_swipl.jl, which in CI FAIL without swipl-devel checked out at the pin (CI.yml's
  # analysis job) — every mutant's verdict would then stand on a red baseline (MEASURED 2026-10-20: the
  # FullSuite battery, refused by `collect`). The checkout below is made when the battery's targets name
  # that script, or either of those test files (LB4A: its mutants target them directly; the manifest-vs-
  # `git ls-tree` testset of test_vendored_swipl.jl is what kills a manifest line added or dropped).
  # LB4B2 (slice 17): test/core_lang/test_cont_boot_swipl.jl reads the checkout too (`@test have_up`, the opcode-order
  # testset): without it every mutant reaching that testset was "caught" at that line, a no-op included.
  LOGICKERNEL_UPSTREAM_SWIPL_DEVEL: ${{ github.workspace }}/.upstream/swipl-devel
  # a push to mutants/<step> has no inputs: the list is tools/mutants/<step>.py, the targets the
  # list's own (the `plan` job's output), the limit the default
  MUTANTS: ${{ inputs.mutants || format('tools/{0}.py', github.ref_name) }}
  IDS: ${{ inputs.ids }}
  LIMIT_S: ${{ inputs.limit_s || '1500' }}

jobs:
  # The matrix: one entry per mutant, from the list itself (the same file the local driver reads).
  plan:
    name: Plan
    runs-on: ubuntu-24.04   # pinned: CI.yml's note above `jobs:`
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      targets: ${{ steps.plan.outputs.targets }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: plan
        run: python3 tools/mutate_ci.py plan "$MUTANTS" $IDS >> "$GITHUB_OUTPUT"

  # SHARDS ON THE WARM DAEMON (GATESPEED, audit D-0530): N jobs (N = max(1, min(6, ceil(count/6)))), each with ONE
  # setup (checkout, the shared depot cache, ONE instantiate), the warm daemon started once, and its slice of the
  # list run through tools/mutate_ci.py `warm` (the local driver's loop: apply, Revise hot-reloads, run the targets
  # in the daemon, restore). Shard 1 runs the UNMUTATED targets first (baseline.json), every shard ends with a
  # closing baseline (a red one makes the shard's records NO VERDICT). A mutant marked `"fresh": True` in its list
  # runs in a fresh process, as the one-job-per-mutant battery ran them (the escape hatch for a mutant the warm
  # daemon decides differently from a fresh process).
  shard:
    name: Shard ${{ matrix.shard }}/${{ matrix.of }}
    needs: plan
    runs-on: ubuntu-24.04   # pinned: CI.yml's note above `jobs:`
    timeout-minutes: 120
    strategy:
      fail-fast: false                # every shard gets its verdicts
      matrix: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/oracle
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687  # v3.0.3
        with:
          version: '1.13'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36  # v3.5.0
        with:
          cache-name: julia-cache;lk-shared;julia=1.13
          include-matrix: 'false'
      # AUDIT D-0535 item 1: the shared depot cache holds the registry, packages, artifacts and the compiled caches of the
      # DEPENDENCIES only. The package under test's OWN compiled cache (compiled/<julia>/LogicKernel*) is dropped right
      # after the restore (a stale precompiled copy could keep a mutant from taking effect) ...
      - name: No restored compiled LogicKernel (the shared cache is dependencies only)
        run: |
          for d in "$HOME"/.julia/compiled/v*/LogicKernel*; do
              [ -e "$d" ] && { echo "dropping the restored $d"; rm -rf "$d"; }
          done
          true
      - name: The pinned swipl-devel commit (a whole-suite target, test/test_vendored_*.jl, or test_cont_boot_swipl.jl)
        id: pin
        if: ${{ contains(format('{0} {1}', inputs.targets, needs.plan.outputs.targets), 'mutate_suite') || contains(format('{0} {1}', inputs.targets, needs.plan.outputs.targets), 'test_vendored') || contains(format('{0} {1}', inputs.targets, needs.plan.outputs.targets), 'test_cont_boot') }}
        run: echo "commit=$(sed -n 's/^commit:[[:space:]]*//p' tools/SWIPL_VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ steps.pin.outputs.commit != '' }}
        with:
          repository: SWI-Prolog/swipl-devel
          ref: ${{ steps.pin.outputs.commit }}
          path: .upstream/swipl-devel
          submodules: true
      # PINNED to commit SHAs (D-0562 item 4), no longer rev="master": the same three commits as CI.yml and evidence.yml
      # (JET 6f20b0f0, LoweredCodeUtils 6f5c109b, Aqua 84f9eb4f). Move the three TOGETHER, in every workflow that installs them, with the reason.
      # Revise is in the tools' own call (as CI.yml's Tooling job installs them: one resolve) when the targets
      # name the static analysis; the warm daemon loads it from the DEFAULT environment (tools/warm_session.jl)
      - name: Install the analysis tools (the targets name test/test_static_analysis.jl, one part of it or the whole suite)
        if: ${{ contains(format('{0} {1}', inputs.targets, needs.plan.outputs.targets), 'test_static_analysis') || contains(format('{0} {1}', inputs.targets, needs.plan.outputs.targets), 'mutate_sa_part') || contains(format('{0} {1}', inputs.targets, needs.plan.outputs.targets), 'mutate_suite') }}
        run: |
          julia -e 'using Pkg; Pkg.add([
            PackageSpec(url="https://github.com/JuliaDebug/LoweredCodeUtils.jl", rev="6f5c109b054a9f5c04aa042e6fe958fd4cd4f6b7"),
            PackageSpec(url="https://github.com/aviatesk/JET.jl", rev="6f20b0f01761ef66a9d4846f7f0ed2346fd5ff1e"),
            PackageSpec(url="https://github.com/JuliaTesting/Aqua.jl", rev="84f9eb4f4f947ec96c40e8b1274d5b7865a7ecfd"),
            PackageSpec(name="AllocCheck"),
            PackageSpec(name="Revise")])'
      - name: Revise in the default environment (the warm daemon hot-reloads each mutant through it)
        run: julia -e 'using Pkg; Pkg.add(PackageSpec(name="Revise"))'
      # THE HOME TREE (LB4 b2): every database is a copy of the BOOTED one, which reads HOME/boot/init.pl; `home/` is
      # generated and git-ignored, so a fresh checkout has none (Evidence 42021496734: 664 failing tests, "build the home
      # tree first"). tools/build_home.jl links the tracked vendor/ and packages/plunit: no network, no packages, about a second.
      - name: The home tree (tools/build_home.jl)
        run: julia tools/build_home.jl
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      # The warm daemon is a `systemd-run --user` unit (CI.yml's Tooling job, the same step): a runner has no user
      # manager until lingering is enabled; the step fails if `systemd-run --user --scope` still does not work.
      - name: A user systemd manager (the warm lane's units and scopes)
        run: |
          sudo loginctl enable-linger "$USER"
          uid="$(id -u)"
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus"
          for _ in $(seq 60); do
              systemctl --user is-system-running 2> /dev/null | grep -qE '^(running|degraded)$' && break
              sleep 1
          done
          systemctl --user is-system-running || true
          systemd-run --user --scope --quiet true
      - name: Start the warm daemon
        run: tools/warm.sh start
      # Applies each mutant of the slice (its text must occur exactly once: else BADMATCH), runs the targets in
      # the warm daemon, restores the file, writes mutation-out/<name>.json and the log. Exits 0 whatever the
      # verdict: the verdict is DATA here, judged in one place (`verdicts`). `locked`: the lane is held for the run.
      - name: Run the shard's mutants on the warm daemon
        run: tools/warm.sh locked python3 tools/mutate_ci.py warm "$MUTANTS" "$SHARD" "$OF" "$LIMIT_S" $TARGETS
        env:
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
          TARGETS: ${{ inputs.targets || needs.plan.outputs.targets }}
      - name: The daemon's session log
        if: ${{ !cancelled() }}
        run: mkdir -p mutation-out && cp .warm/session.log "mutation-out/session-$SHARD.log" || true
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: verdict-shard-${{ matrix.shard }}
          path: mutation-out/
      # ... and again at the job's end, BEFORE the cache action's post step saves the depot: it never enters the key
      - name: No compiled LogicKernel in the shared cache
        if: ${{ always() }}
        run: |
          for d in "$HOME"/.julia/compiled/v*/LogicKernel*; do
              [ -e "$d" ] && { echo "dropping $d before the cache save"; rm -rf "$d"; }
          done
          true

  # The targets on the UNMUTATED tree. A mutant's "caught" means nothing against a red baseline (a guard is
  # proved against a green one), so `verdicts` refuses the battery when this is red. The baseline itself runs
  # FIRST inside shard 1, on the warm daemon; this job only reads its record from the artifact, so the job name,
  # `Baseline (unmutated)`, stays what tools/battery_table.py, tools/ci_status.sh and the tests look for.
  baseline:
    name: Baseline (unmutated)
    needs: [plan, shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04   # pinned: CI.yml's note above `jobs:`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: verdict-shard-*
          path: mutation-out
          merge-multiple: true
      - name: Shard 1's baseline record
        run: python3 tools/mutate_ci.py check-baseline

  verdicts:
    name: Verdict table
    needs: [plan, shard, baseline]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04   # pinned: CI.yml's note above `jobs:`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: verdict-*
          path: mutation-out
          merge-multiple: true
      # The table (mutant · verdict · seconds · what it breaks), written to the job summary and to
      # verdicts.md. Exit 1 when the baseline is not green, a planned mutant has no verdict file
      # (a job that died is not a verdict), or any mutant blocks.
      - name: Collect
        run: python3 tools/mutate_ci.py collect "$MUTANTS" "$COUNT" $IDS | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}
        env:
          COUNT: ${{ needs.plan.outputs.count }}
      # The same table as this job's annotations: the summary and the logs need a token to read
      # through the API, a public repository's check-run annotations do not.
      - name: The table as annotations
        if: ${{ !cancelled() }}
        run: python3 tools/mutate_ci.py annotate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: verdicts
          path: mutation-out/verdicts.md
