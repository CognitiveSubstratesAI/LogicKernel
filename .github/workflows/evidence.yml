# The evidence run, in CI (user, 2026-10-13): the whole suite with EVERY gate required — the static
# analysis (JET, Aqua, AllocCheck), the live differentials against the oracle — as ONE JOB PER TERM
# TYPE, in parallel. THE COMMIT GATE: a commit is pushed to a branch `gate/<name>`, this workflow
# runs there, and `main` is fast-forwarded to that commit only when the run is green
# (tools/githooks/pre-push asks tools/ci_status.sh for a green run of THIS workflow, by name, on
# exactly the pushed commit). Also nightly on `main`, and by hand.
# Each job runs the units of ONE implementation (LOGICKERNEL_TERM_ONLY, test/runtests.jl); the
# files that are not term-generic run with the reference type.
# SHARDED (D-0059, 2026-10-20; test/ci_slices.jl): each type's files in FILE_GROUPS groups, one job
# each, and the static analysis (JET, Aqua, AllocCheck — the costliest unit) in SA_SHARDS jobs of its
# own. One gather per type keeps the type's name (`reference`, `alt`, `alt_interned`: main's ruleset
# requires those checks by name), and `units` (Verdict table) checks the whole run: every unit run
# exactly once, by a job of its own type; the shards' counts summing to the manifest's, each shard's
# non-zero — a dropped job or a shard that analysed nothing turns it red (tools/evidence_ci.py).
# The matrices below must list exactly 1..FILE_GROUPS and 1..SA_SHARDS: the gathers expect every one.
# NO BENCHMARKS HERE (tools/bench.jl stays local, on a quiet machine).
# 🔴 THE NAME BELOW IS READ BY tools/githooks/pre-push (`EVIDENCE_WORKFLOW`): rename both or neither.
name: Evidence (three term types)
on:
  push:
    branches:
      - 'gate/**'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'              # nightly, 02:17 UTC

concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write          # julia-actions/cache deletes old caches (its README)

env:
  FILE_GROUPS: '2'
  SA_SHARDS: '8'

jobs:
  evidence:
    name: ${{ matrix.term }} · files ${{ matrix.group }}/2
    runs-on: ubuntu-24.04   # pinned: CI.yml's note above `jobs:`
    # a job-level block REPLACES the workflow's: every scope listed (id-token for Codecov's OIDC)
    permissions:
      contents: read
      actions: write
      id-token: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        term: [reference, alt, alt_interned]
        group: [1, 2]
    env:
      JULIA_NUM_THREADS: '4'
      LOGICKERNEL_REQUIRE_TOOLS: '1'
      LOGICKERNEL_REQUIRE_SWIPL: '1'
      LOGICKERNEL_TERM_ONLY: ${{ matrix.term }}
      LOGICKERNEL_FILE_GROUP: ${{ matrix.group }}/2    # /FILE_GROUPS (a job's env has no `env` context)
      LOGICKERNEL_UNITS_OUT: ${{ github.workspace }}/evidence-out/units_${{ matrix.term }}_g${{ matrix.group }}.tsv
      LOGICKERNEL_UPSTREAM_SWIPL_DEVEL: ${{ github.workspace }}/.upstream/swipl-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # THE UPSTREAM CHECKOUT (user, 2026-10-14): swipl-devel at the pinned commit, its submodules
      # with it, so test/test_vendored_plunit.jl checks the vendored plunit against the gitlink
      # HERE — that testset FAILS in CI without it, never inert. Outside git and the formatter
      # (.gitignore, .JuliaFormatter.toml: `.upstream`).
      - name: The pinned swipl-devel commit
        id: pin
        run: echo "commit=$(sed -n 's/^commit:[[:space:]]*//p' tools/SWIPL_VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: SWI-Prolog/swipl-devel
          ref: ${{ steps.pin.outputs.commit }}
          path: .upstream/swipl-devel
          submodules: true
      - uses: ./.github/actions/oracle
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687  # v3.0.3
        with:
          version: '1.13'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36  # v3.5.0
      # (no analysis tools: the static analysis is in no file group — the `static_analysis` jobs)
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      # COVERAGE PER TERM TYPE (user, 2026-10-14): each type's run is instrumented and uploaded
      # under its own Codecov flag; Codecov merges the uploads of one commit — a type's file groups
      # under one flag — so the three flags land on the SHA `main` is later fast-forwarded to
      # (CI.yml re-files it under main).
      - name: Run this term type's units of this file group with every gate required
        env:
          JOB: ${{ matrix.term }}_g${{ matrix.group }}    # through env, never interpolated into the script
        run: |
          mkdir -p evidence-out
          start=$(date +%s)
          julia --project=. --code-coverage=user test/runtests.jl
          echo "| $JOB | passed | $(( $(date +%s) - start )) s |" >> "evidence-out/row_$JOB.md"
      - name: Record a failed run
        if: ${{ failure() }}
        env:
          JOB: ${{ matrix.term }}_g${{ matrix.group }}
        run: |
          mkdir -p evidence-out
          echo "| $JOB | **FAILED** | — |" >> "evidence-out/row_$JOB.md"
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38  # v1
        if: ${{ !cancelled() }}
      # A gate branch's upload does not gate the evidence (main's, in CI.yml, does)
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: lcov.info
          flags: ${{ matrix.term }}
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          fail_ci_if_error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-${{ matrix.term }}-g${{ matrix.group }}
          path: evidence-out/

  # THE STATIC ANALYSIS IN SHARDS (D-0059): every SA_SHARDS-th manifest entry from the k-th, and the
  # k-th of every SA_SHARDS of its one-off gates (Aqua in exactly one), with the tools REQUIRED
  # (e7f817d's rule per shard: a missing tool is an error, never a skip). No oracle and no upstream
  # checkout: the analysis needs neither. No coverage: it analyses code, it runs almost none.
  static_analysis:
    name: static analysis ${{ matrix.shard }}/8
    runs-on: ubuntu-24.04   # pinned: CI.yml's note above `jobs:`
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      JULIA_NUM_THREADS: '4'
      LOGICKERNEL_REQUIRE_TOOLS: '1'
      LOGICKERNEL_TERM_ONLY: reference
      LOGICKERNEL_SA_SHARD: ${{ matrix.shard }}/8      # /SA_SHARDS
      LOGICKERNEL_UNITS_OUT: ${{ github.workspace }}/evidence-out/units_sa_${{ matrix.shard }}.tsv
      LOGICKERNEL_SA_COUNTS_OUT: ${{ github.workspace }}/evidence-out/sa_${{ matrix.shard }}.tsv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687  # v3.0.3
        with:
          version: '1.13'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36  # v3.5.0
      # The analysis tools, as CI.yml's `analysis` job installs them (JET, LoweredCodeUtils and Aqua
      # from master, as a set)
      - name: Install the analysis tools into the default environment
        run: |
          julia -e 'using Pkg; Pkg.add([
            PackageSpec(url="https://github.com/JuliaDebug/LoweredCodeUtils.jl", rev="master"),
            PackageSpec(url="https://github.com/aviatesk/JET.jl", rev="master"),
            PackageSpec(url="https://github.com/JuliaTesting/Aqua.jl", rev="master"),
            PackageSpec(name="AllocCheck")])'
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run this shard of the static analysis
        env:
          JOB: sa_${{ matrix.shard }}
        run: |
          mkdir -p evidence-out
          start=$(date +%s)
          julia --project=. test/runtests.jl
          echo "| $JOB | passed | $(( $(date +%s) - start )) s |" >> "evidence-out/row_$JOB.md"
      - name: Record a failed run
        if: ${{ failure() }}
        env:
          JOB: sa_${{ matrix.shard }}
        run: |
          mkdir -p evidence-out
          echo "| $JOB | **FAILED** | — |" >> "evidence-out/row_$JOB.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-sa-${{ matrix.shard }}
          path: evidence-out/

  # ONE GATHER PER TERM TYPE, under the type's own name (main's ruleset requires `reference`, `alt`
  # and `alt_interned`): the type's file groups all green, and together every unit of the type
  term:
    name: ${{ matrix.term }}
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04   # pinned: CI.yml's note above `jobs:`
    strategy:
      fail-fast: false
      matrix:
        term: [reference, alt, alt_interned]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: evidence-${{ matrix.term }}-g*
          path: evidence-out
          merge-multiple: true
      - name: Collect
        env:
          TERM_TYPE: ${{ matrix.term }}
        run: python3 tools/evidence_ci.py term evidence-out "$TERM_TYPE" "$FILE_GROUPS"

  units:
    name: Verdict table
    needs: [evidence, static_analysis]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04   # pinned: CI.yml's note above `jobs:`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: evidence-*
          path: evidence-out
          merge-multiple: true
      # The table (job · verdict · seconds) and THE PARTITION over every job (tools/evidence_ci.py);
      # each unit's passes (unit_counts.tsv) and the measured file costs (unit_costs.tsv, the
      # replacement for test/unit_costs.tsv) as the artifact `unit-costs`.
      - name: Collect
        run: python3 tools/evidence_ci.py verdict evidence-out "$FILE_GROUPS" "$SA_SHARDS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: unit-costs
          path: |
            evidence-out/unit_counts.tsv
            evidence-out/unit_costs.tsv
