name: CI
on:
  push:
    branches:
      - main
      # A GATE BRANCH (user, 2026-10-13): a commit is pushed to `gate/<name>` first; there
      # `test` and `format` run here and the whole suite runs as evidence.yml's three parallel
      # jobs — `analysis` below is skipped, it is that same suite in one job. `main` is then
      # fast-forwarded to the commit CI judged (tools/githooks/pre-push refuses anything else).
      - 'gate/**'
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# LEAST PRIVILEGE (user, 2026-10-14): a job without its own block reads the repository only.
permissions:
  contents: read

# THE RUNNER IMAGE IS PINNED (ubuntu-24.04, never ubuntu-latest; 2026-10-20): the arithmetic calls libm
# by ccall and its rows are pinned from swipl, and the oracle is built on the runner — a new image (a
# new glibc, so a new libm) would change both under an unchanged commit. Moving to a newer image is a
# deliberate step with its own differential run. The same pin in evidence.yml and mutation.yml.
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Multi-threaded like the local runner (`JULIA_TEST_THREADS:-4`), so CI and local contend alike.
    # An env var and not `julia_args`: Pkg passes JULIA_NUM_THREADS through to the test worker, and
    # it must be NON-EMPTY. (Learned in PathMap CI, 2026-09-28: single-threaded, its concurrency
    # tests skipped and the inert-testset guard failed the run — correctly.)
    env:
      JULIA_NUM_THREADS: '4'
      # THE BOUNDS-CHECKED RUN (user, 2026-10-04): Julia 1.13's Pkg.test no longer forces
      # --check-bounds=yes; julia-runtest passes it (its `check_bounds` input, stated below), and
      # test/test_check_bounds.jl FAILS this job if bounds checking is not really on.
      LOGICKERNEL_REQUIRE_CHECK_BOUNDS: '1'
      # test/runtests.jl writes JUnit XML here for Codecov Test Analytics (test/junit_report.jl)
      LOGICKERNEL_JUNIT: ${{ github.workspace }}/junit.xml
      LOGICKERNEL_UPSTREAM_SWIPL_DEVEL: ${{ github.workspace }}/.upstream/swipl-devel
      # Pkg.test's isolated environment has no JET/Aqua/AllocCheck: the ONE job allowed to skip the
      # static analysis, and it says so (test/test_static_analysis.jl: under CI a missing tool is an
      # error everywhere else; the skip leaves a ::warning annotation). The `analysis` job runs it.
      LOGICKERNEL_STATIC_ANALYSIS_OPTOUT: 'pkg-test'
    # A job-level `permissions:` block REPLACES the default token scopes, so every scope a step
    # needs is listed: `id-token: write` lets codecov-action authenticate with GitHub OIDC (see the
    # upload step); `actions: write` lets julia-actions/cache delete old caches (its README).
    permissions:
      contents: read
      actions: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min'   # the LOWER BOUND of [compat] julia: setup-julia@v2 installs the earliest compatible
                    # version (1.13.0); v3 renamed this 'min-patch' ('min-patch' fails on v2)
          - '1'           # the latest release
        os:
          - ubuntu-24.04   # pinned, not -latest: see the note above `jobs:`
        arch:
          - x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # THE UPSTREAM CHECKOUT (user, 2026-10-14): swipl-devel at the pinned commit, its submodules
      # with it, so test/test_vendored_plunit.jl checks the vendored plunit against the gitlink
      # HERE — that testset FAILS in CI without it, never inert. Outside git and the formatter
      # (.gitignore, .JuliaFormatter.toml: `.upstream`).
      - name: The pinned swipl-devel commit
        id: pin
        run: echo "commit=$(sed -n 's/^commit:[[:space:]]*//p' tools/SWIPL_VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: SWI-Prolog/swipl-devel
          ref: ${{ steps.pin.outputs.commit }}
          path: .upstream/swipl-devel
          submodules: true
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687  # v3.0.3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36  # v3.5.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1  # v1
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271  # v1
        with:
          check_bounds: 'yes'
      # Coverage → Codecov. The repo's CODECOV_TOKEN secret when it exists; GitHub OIDC when it does
      # not (that is what `id-token: write` above is for) — so a missing secret no longer means a
      # silently skipped upload.
      # 🔴 WHY: the first run uploaded NOTHING while the step reported success. Its log:
      #   "Upload queued for processing failed: {"message":"Token required because branch is protected"}"
      # The `token: ${{ secrets.CODECOV_TOKEN }}` input was EMPTY (no such secret reached this repo),
      # and `fail_ci_if_error: false` turned the rejection into a green check. Read it with
      # `workflows/gh_ci_log.sh LogicKernel 'Upload queued'` in the CognitiveSubstratesAI workspace.
      # ✅ `fail_ci_if_error: true` since 2026-10-02: the OIDC upload from a668c1c LANDED (Codecov:
      # activated, last upload 19:15:07Z, log "Upload queued for processing complete"). A failed
      # upload now turns CI red instead of hiding behind a green check.
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38  # v1
      # NO src/ FILE AT 0% (user, 2026-10-14): the known ones are listed, and the list only shrinks
      # (tools/coverage_zero.py; its own tests run in the `tooling` job). Once per run.
      - name: No src/ file at 0% coverage (the ratchet)
        if: matrix.version == '1'
        run: python3 tools/coverage_zero.py lcov.info tools/coverage_zero_known.txt
      # 🔴 THE UPLOADS DO NOT GATE THE JOB (user, 2026-10-05). Coverage is not a correctness gate, and
      # a job that goes red on every push because of an outside outage trains everyone to ignore
      # red — measured: from 2026-10-05 00:07 UTC Codecov's uploader could not download its own
      # `codecov.SHA256SUM.sig`, and every run went red with all tests passing. Each upload keeps
      # `fail_ci_if_error: true` (so a failure is a FAILED STEP, not a silent success) under
      # `continue-on-error`, and the step after them prints a warning annotation when one failed.
      # The test step above is unchanged and still gates.
      # 🔴 ON main A FAILED UPLOAD IS RED (user, 2026-10-14 — reverses the 2026-10-05 decision on
      # main only): `continue-on-error` holds off main, so a gate branch still is not held hostage
      # by a Codecov outage, while main's dashboard can no longer go stale unnoticed.
      # `override_branch: main` on main (MEASURED 2026-10-14, Codecov API): every commit WAS
      # uploaded, but filed under `gate/ci-offload`, the first branch its SHA was pushed on; `main`
      # is fast-forwarded to the same SHA later, so Codecov's main view stayed at 12ddbf7 — the last
      # commit pushed to main directly. The upload on main re-files the commit under main.
      - id: upload_coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        with:
          files: lcov.info
          flags: julia-${{ matrix.version }}
          override_branch: ${{ github.ref == 'refs/heads/main' && 'main' || '' }}
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          fail_ci_if_error: true
      # Test results → Codecov Test Analytics. `!cancelled()`, not the default success(): a run whose
      # tests FAILED is exactly the one whose results matter. Same authentication as coverage.
      - name: Upload test results to Codecov
        id: upload_results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        with:
          report_type: test_results
          files: junit.xml
          flags: julia-${{ matrix.version }}
          override_branch: ${{ github.ref == 'refs/heads/main' && 'main' || '' }}
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          fail_ci_if_error: true
      - name: Warn if a Codecov upload failed (off main it does not gate the job)
        if: ${{ !cancelled() && (steps.upload_coverage.outcome == 'failure' || steps.upload_results.outcome == 'failure') }}
        env:
          COV: ${{ steps.upload_coverage.outcome }}
          RES: ${{ steps.upload_results.outcome }}
        run: |
          echo "::warning title=Codecov upload failed::coverage $COV, test results $RES — the tests gate this job; see the upload step's log for Codecov's error"

  # ── THE PROACTIVE GATES, WITH NOTHING ALLOWED TO SKIP ────────────────────────────────────────────
  # `test` above runs Pkg.test, whose isolated environment has no JET/Aqua/AllocCheck and no swipl,
  # so there test/test_static_analysis.jl and test/core_lang/test_compare_swipl.jl say "not run" and
  # assert they were not required. HERE both are required (the LOGICKERNEL_REQUIRE_* variables turn a
  # missing tool into an error): zero runtime dispatch on every manifest entry, every method covered,
  # Aqua, JET error analysis, AllocCheck, and the live differential against swipl's compare/3.
  # The tools are installed exactly as in the local global environment (JET, Aqua and
  # LoweredCodeUtils from master), so local and CI analyse with the same versions.
  analysis:
    name: Static analysis + live swipl differential
    if: ${{ !startsWith(github.ref_name, 'gate/') }}
    runs-on: ubuntu-24.04
    # THE ORACLE IS A BUILD OF THE PINNED COMMIT (user, 2026-10-11): tools/SWIPL_VERSION names one
    # swipl-devel commit — the one the ported files cite — and `swipl` here is built from exactly
    # it by tools/build_oracle.sh, the recipe the local oracle is built with. The install is
    # CACHED, keyed by the commit and the build flags (`tools/build_oracle.sh --key`), so only the
    # first run after a pin move builds. Before, the job ran inside the official image of a
    # RELEASE, some commits away from the ported source (and before that swipl came from the devel
    # PPA, which moved under a port: 10.1.17, 2026-10-04, run 37218978326).
    timeout-minutes: 75
    permissions:
      contents: read
      actions: write
    env:
      JULIA_NUM_THREADS: '4'
      LOGICKERNEL_REQUIRE_TOOLS: '1'
      LOGICKERNEL_REQUIRE_SWIPL: '1'
      LOGICKERNEL_UPSTREAM_SWIPL_DEVEL: ${{ github.workspace }}/.upstream/swipl-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # THE UPSTREAM CHECKOUT (user, 2026-10-14): swipl-devel at the pinned commit, its submodules
      # with it, so test/test_vendored_plunit.jl checks the vendored plunit against the gitlink
      # HERE — that testset FAILS in CI without it, never inert. Outside git and the formatter
      # (.gitignore, .JuliaFormatter.toml: `.upstream`).
      - name: The pinned swipl-devel commit
        id: pin
        run: echo "commit=$(sed -n 's/^commit:[[:space:]]*//p' tools/SWIPL_VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: SWI-Prolog/swipl-devel
          ref: ${{ steps.pin.outputs.commit }}
          path: .upstream/swipl-devel
          submodules: true
      # The oracle: restored from the cache or built at the pin, put on PATH, and checked to BE
      # that build — one recipe for this job, evidence.yml and mutation.yml (.github/actions/oracle).
      - uses: ./.github/actions/oracle
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687  # v3.0.3
        with:
          version: '1.13'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36  # v3.5.0
      # JET, LoweredCodeUtils and JuliaInterpreter release together: install the tools from master as
      # a set. A pin on one of them (2026-10-03, LoweredCodeUtils v3.9.1 while JET lagged) breaks as
      # soon as the others move on — JET 0.12.3 then REQUIRED LoweredCodeUtils 3.10 (run 37139741792).
      - name: Install the analysis tools into the default environment
        run: |
          julia -e 'using Pkg; Pkg.add([
            PackageSpec(url="https://github.com/JuliaDebug/LoweredCodeUtils.jl", rev="master"),
            PackageSpec(url="https://github.com/aviatesk/JET.jl", rev="master"),
            PackageSpec(url="https://github.com/JuliaTesting/Aqua.jl", rev="master"),
            PackageSpec(name="AllocCheck")])'
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run the suite with every gate required
        run: julia --project=. test/runtests.jl

  format:
    name: Format (Blue)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687  # v3.0.3
        with:
          version: '1.13'
      # No julia-actions/cache here — a cached Manifest can pin an older JuliaFormatter than the one
      # pinned below, and local/CI formatting then drift apart.
      - name: Check formatting
        run: |
          julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="2.14.0"))'
          julia -e 'using JuliaFormatter; println("JuliaFormatter ", pkgversion(JuliaFormatter))'
          julia -e 'using JuliaFormatter; format(".")'
          if ! git diff --quiet; then
            echo "::error::Formatting check failed — files below are not Blue-formatted:"
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "All files Blue-formatted."

  # ── THE TOOLING GATE (user, 2026-10-14) ──────────────────────────────────────────────────────────
  # The gate checked the engine and not the tools that run the gate: 1dada85 passed CI with a
  # defect tools/test_warm.sh catches (a deleted function Revise kept failed `warm.sh check` instead
  # of restarting the daemon — 11 failed cases, found by the next session). This job runs the
  # tooling suites whenever the tooling changes; it is part of the CI workflow, so `main` moves only
  # when it is green too (tools/githooks/pre-push: every run on the SHA completed and green).
  # It always RUNS and decides inside whether the tooling changed — GitHub's `paths:` filter is
  # unreliable on a newly pushed branch — and an undecidable diff runs everything (fails closed).
  tooling:
    name: Tooling suites (warm lane, evidence, oracle cache)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      JULIA_NUM_THREADS: '4'
      LOGICKERNEL_UPSTREAM_SWIPL_DEVEL: ${{ github.workspace }}/.upstream/swipl-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Did the tooling change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}   # through env, never interpolated into the script
        run: |
          # against main for a gate branch or a PR; against the previous push on main itself
          if [ "$GITHUB_REF" = refs/heads/main ] && [ -n "$BEFORE" ] &&
             git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
              base="$BEFORE"
          else
              base="$(git merge-base origin/main HEAD 2> /dev/null)" || base=""
          fi
          if [ -z "$base" ]; then
              echo "no base to compare with — running every tooling suite (fails closed)"
              echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$base" HEAD -- tools .github test/test_port_check.jl test/test_gate_split.jl)"
          printf 'tooling files changed since %s:\n%s\n' "${base:0:7}" "${files:-(none)}"
          echo "run=$([ -n "$files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: No tooling change — nothing to run
        if: steps.changed.outputs.run != 'true'
        run: echo "::notice title=Tooling suites::no file under tools/, .github/ or the tooling tests changed"
      - name: The pinned swipl-devel commit
        if: steps.changed.outputs.run == 'true'
        id: pin
        run: echo "commit=$(sed -n 's/^commit:[[:space:]]*//p' tools/SWIPL_VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.changed.outputs.run == 'true'
        with:
          repository: SWI-Prolog/swipl-devel
          ref: ${{ steps.pin.outputs.commit }}
          path: .upstream/swipl-devel
          submodules: true
      - uses: ./.github/actions/oracle
        if: steps.changed.outputs.run == 'true'
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687  # v3.0.3
        if: steps.changed.outputs.run == 'true'
        with:
          version: '1.13'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36  # v3.5.0
        if: steps.changed.outputs.run == 'true'
      # the warm lane's preflight runs the formatter and the fast static pre-check in the daemon:
      # the same tools, the same versions as `analysis` and `format`. And REVISE: the daemon loads
      # it from the default environment (tools/warm_session.jl), and without it no src edit
      # hot-reloads — MEASURED on this job's first run (7d1437f): 15 test_warm.sh cases red, every
      # one that plants an edit and expects the daemon to see it.
      - name: Install the analysis tools, the formatter and Revise into the default environment
        if: steps.changed.outputs.run == 'true'
        run: |
          julia -e 'using Pkg; Pkg.add([
            PackageSpec(url="https://github.com/JuliaDebug/LoweredCodeUtils.jl", rev="master"),
            PackageSpec(url="https://github.com/aviatesk/JET.jl", rev="master"),
            PackageSpec(url="https://github.com/JuliaTesting/Aqua.jl", rev="master"),
            PackageSpec(name="AllocCheck"),
            PackageSpec(name="JuliaFormatter", version="2.14.0"),
            PackageSpec(name="Revise")])'
      - if: steps.changed.outputs.run == 'true'
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      # The warm daemon and the evidence workers are `systemd-run --user` units, and the scripts
      # cap themselves in user scopes: a runner has no user manager until lingering is enabled.
      # REQUIRED here — the step fails if `systemd-run --user --scope` still does not work, so the
      # cap cases of test_warm.sh cannot skip silently.
      - name: A user systemd manager (the warm lane's units and scopes)
        if: steps.changed.outputs.run == 'true'
        run: |
          sudo loginctl enable-linger "$USER"
          uid="$(id -u)"
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus"
          for _ in $(seq 60); do
              systemctl --user is-system-running 2> /dev/null | grep -qE '^(running|degraded)$' && break
              sleep 1
          done
          systemctl --user is-system-running || true
          systemd-run --user --scope --quiet true
      # tools/ci_status.sh (the preflight's first step) falls back to `git credential fill` when the
      # anonymous API answers no run list (its 60-an-hour limit, shared runner IPs); checkout keeps
      # its token as an http header, not a credential, so serve the job's token as one.
      - name: The job's token for tools/ci_status.sh
        if: steps.changed.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global credential.https://github.com.helper \
            '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          echo "GH_TOKEN=$GH_TOKEN" >> "$GITHUB_ENV"
      - name: tools/test_coverage_zero.sh
        if: steps.changed.outputs.run == 'true'
        run: tools/test_coverage_zero.sh
      - name: tools/test_oracle_cache.sh
        if: steps.changed.outputs.run == 'true'
        run: tools/test_oracle_cache.sh
      - name: tools/test_evidence.sh
        if: steps.changed.outputs.run == 'true'
        run: tools/test_evidence.sh
      - name: tools/test_warm.sh
        if: steps.changed.outputs.run == 'true'
        run: tools/test_warm.sh
